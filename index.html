<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Undangan Pernikahan</title>

  <!-- Google Fonts & Font Awesome Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Sacramento&family=Work+Sans:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Work Sans', sans-serif;
      background: #fdfbf7;
      color: #555;
      display: flex;
      justify-content: center;
      padding: 15px;
    }

    .container {
      max-width: 430px;
      width: 100%;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.08);
      overflow: hidden;
      padding: 25px 20px;
      text-align: center;
    }

    /* Hero & Foto Utama */
    .hero-img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      border-radius: 15px;
      margin-bottom: 20px;
    }

    h1.title {
      font-family: 'Sacramento', cursive;
      font-size: 3rem;
      color: #8b5e3c;
      margin: 10px 0;
    }

    /* Kotak Nama Tamu */
    .tamu-box {
      background: #f7f3ed;
      padding: 12px;
      border-radius: 10px;
      border: 1px dashed #d4c5b9;
      margin: 15px 0 25px;
    }
    .tamu-box p { font-size: 0.85rem; color: #777; }
    .tamu-box h3 { font-size: 1.2rem; color: #8b5e3c; margin-top: 4px; }

    /* Musik Floating Button */
    .music-btn {
      position: fixed;
      bottom: 25px;
      right: 25px;
      width: 45px;
      height: 45px;
      background: #8b5e3c;
      color: #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
      z-index: 99;
    }

    /* Countdown Section */
    .countdown-section {
      background: #f7f3ed;
      padding: 15px;
      border-radius: 12px;
      margin: 25px 0;
    }
    .countdown-section h4 { color: #8b5e3c; margin-bottom: 12px; }
    .timer-grid { display: flex; justify-content: space-around; }
    .timer-box {
      background: #fff;
      padding: 8px 12px;
      border-radius: 8px;
      min-width: 60px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }
    .timer-box span { font-size: 1.3rem; font-weight: 600; color: #8b5e3c; }
    .timer-box small { font-size: 0.75rem; color: #888; display: block; }

    /* Galeri Foto */
    .gallery-title { color: #8b5e3c; margin: 25px 0 15px; font-size: 1.2rem; }
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .gallery-grid img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      border-radius: 10px;
    }

    /* Form RSVP */
    .rsvp-section { text-align: left; margin-top: 30px; }
    .rsvp-section h4 { text-align: center; color: #8b5e3c; margin-bottom: 15px; }
    .rsvp-section input, .rsvp-section select, .rsvp-section textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-family: inherit;
    }
    .rsvp-section button {
      width: 100%;
      padding: 12px;
      background: #8b5e3c;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Tombol Musik -->
  <div class="music-btn" onclick="toggleMusic()">
    <i id="musicIcon" class="fas fa-music"></i>
  </div>
  <audio id="bgMusic" loop src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3"></audio>

  <div class="container">
    <!-- Foto Utama Pasangan -->
    <img src="https://picsum.photos/400/250?wedding" alt="Wedding" class="hero-img">

    <p style="text-transform: uppercase; letter-spacing: 2px; font-size: 0.8rem;">The Wedding of</p>
    <h1 class="title">Sephia & Fikri</h1>

    <!-- Nama Tamu Otomats -->
    <div class="tamu-box">
      <p>Kepada Yth. Bapak/Ibu/Saudara/i:</p>
      <h3 id="namaTamu">Tamu Undangan</h3>
    </div>

    <p>Mengarungi bahtera kehidupan bersama, kami mengundang Anda untuk hadir di hari bahagia kami.</p>

    <!-- Countdown Timer -->
    <div class="countdown-section">
      <h4>Hitung Mundur Acara</h4>
      <div class="timer-grid">
        <div class="timer-box"><span id="days">00</span><small>Hari</small></div>
        <div class="timer-box"><span id="hours">00</span><small>Jam</small></div>
        <div class="timer-box"><span id="minutes">00</span><small>Menit</small></div>
        <div class="timer-box"><span id="seconds">00</span><small>Detik</small></div>
      </div>
    </div>

    <!-- Galeri Foto -->
    <h4 class="gallery-title">Momen Bahagia</h4>
    <div class="gallery-grid">
      <img src="https://picsum.photos/200/200?1" alt="Foto 1">
      <img src="https://picsum.photos/200/200?2" alt="Foto 2">
      <img src="https://picsum.photos/200/200?3" alt="Foto 3">
      <img src="https://picsum.photos/200/200?4" alt="Foto 4">
    </div>

    <!-- Form RSVP -->
    <div class="rsvp-section">
      <h4>Konfirmasi Kehadiran</h4>
      <form id="rsvpForm">
        <input type="text" name="nama" placeholder="Nama Lengkap" required>
        <select name="kehadiran" required>
          <option value="">-- Pilih Kehadiran --</option>
          <option value="Hadir">Hadir</option>
          <option value="Tidak Hadir">Tidak Hadir</option>
        </select>
        <input type="number" name="jumlah" placeholder="Jumlah Tamu" min="1" required>
        <textarea name="pesan" placeholder="Ucapan & Doa" rows="3"></textarea>
        <button type="submit" id="btnSubmit">Kirim Ucapan</button>
      </form>
    </div>
  </div>

  <script>
    // 1. Nama Tamu Otomatis (?to=NamaTamu)
    const urlParams = new URLSearchParams(window.location.search);
    const nama = urlParams.get('to');
    if (nama) {
      document.getElementById('namaTamu').innerText = decodeURIComponent(nama);
    }

    // 2. Musik Latar Latar
    const music = document.getElementById("bgMusic");
    const musicIcon = document.getElementById("musicIcon");
    let isPlaying = false;

    function toggleMusic() {
      if (isPlaying) {
        music.pause();
        musicIcon.className = "fas fa-volume-mute";
      } else {
        music.play();
        musicIcon.className = "fas fa-music";
      }
      isPlaying = !isPlaying;
    }

    // Auto Play saat pengguna pertama kali melakukan klik di halaman
    document.addEventListener('click', function() {
      if (!isPlaying) { toggleMusic(); }
    }, { once: true });

    // 3. Countdown Timer (Tanggal Acara)
    const targetDate = new Date("2026-12-12T09:00:00").getTime();
    setInterval(() => {
      const now = new Date().getTime();
      const distance = targetDate - now;

      if (distance < 0) return;

      document.getElementById("days").innerText = Math.floor(distance / (1000 * 60 * 60 * 24));
      document.getElementById("hours").innerText = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      document.getElementById("minutes").innerText = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      document.getElementById("seconds").innerText = Math.floor((distance % (1000 * 60)) / 1000);
    }, 1000);
  </script>
</body>
</html>
